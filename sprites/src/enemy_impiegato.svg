<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 104" width="80" height="104">
  <defs>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="45%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="skn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="hr2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="sh2">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- OMBRA -->
  <ellipse cx="40" cy="101" rx="22" ry="5" fill="#000" opacity="0.2"/>

  <!-- SCARPE -->
  <ellipse cx="28" cy="95" rx="10" ry="4" fill="#1c1410" stroke="#000" stroke-width="1"/>
  <ellipse cx="52" cy="95" rx="10" ry="4" fill="#1c1410" stroke="#000" stroke-width="1"/>

  <!-- GAMBE -->
  <rect x="22" y="66" width="15" height="30" rx="4" fill="url(#tr)" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="43" y="66" width="15" height="30" rx="4" fill="url(#tr)" stroke="#0f172a" stroke-width="1.5"/>
  <!-- highlight gambe -->
  <rect x="23" y="68" width="5" height="26" rx="2" fill="#475569" opacity="0.3"/>
  <rect x="44" y="68" width="5" height="26" rx="2" fill="#475569" opacity="0.3"/>

  <!-- CORPO CAMICIA -->
  <rect x="18" y="36" width="44" height="34" rx="8" fill="url(#shirt)" stroke="#14532d" stroke-width="2" filter="url(#sh2)"/>
  <!-- Taschino ID aziendale -->
  <rect x="20" y="40" width="14" height="10" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.5"/>
  <rect x="21" y="41" width="6" height="2" rx="1" fill="#16a34a" opacity="0.5"/>
  <rect x="21" y="44" width="10" height="1.5" rx="0.5" fill="#64748b" opacity="0.4"/>
  <rect x="21" y="46" width="8" height="1.5" rx="0.5" fill="#64748b" opacity="0.4"/>
  <!-- Logo aziendale -->
  <circle cx="50" cy="47" r="5" fill="#dcfce7" stroke="#16a34a" stroke-width="0.5"/>
  <text x="50" y="50" text-anchor="middle" font-size="5" fill="#16a34a" font-weight="bold">IT</text>
  <!-- Highlight shirt -->
  <rect x="20" y="38" width="7" height="30" rx="3" fill="#22c55e" opacity="0.12"/>

  <!-- BRACCIA -->
  <rect x="4" y="38" width="14" height="26" rx="5" fill="url(#shirt)" stroke="#14532d" stroke-width="1.5"/>
  <rect x="62" y="38" width="14" height="26" rx="5" fill="url(#shirt)" stroke="#14532d" stroke-width="1.5"/>

  <!-- MANI con oggetto (cartella/tablet) -->
  <circle cx="11" cy="68" r="7" fill="url(#skn)" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="69" cy="68" r="7" fill="url(#skn)" stroke="#d97706" stroke-width="1.5"/>
  <!-- tablet in mano destra -->
  <rect x="62" y="64" width="14" height="10" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="63" y="65" width="12" height="8" rx="1" fill="#0ea5e9" opacity="0.8"/>
  <!-- grafici sul tablet -->
  <rect x="64" y="68" width="2" height="4" fill="#22c55e"/>
  <rect x="67" y="66" width="2" height="6" fill="#f59e0b"/>
  <rect x="70" y="67" width="2" height="5" fill="#ef4444"/>

  <!-- COLLO -->
  <rect x="33" y="27" width="14" height="12" rx="4" fill="url(#skn)" stroke="#d97706" stroke-width="1"/>

  <!-- TESTA -->
  <ellipse cx="40" cy="20" rx="20" ry="18" fill="url(#skn)" stroke="#d97706" stroke-width="1.5" filter="url(#sh2)"/>
  <ellipse cx="32" cy="13" rx="9" ry="6" fill="#fef9c3" opacity="0.35"/>
  <ellipse cx="48" cy="22" rx="8" ry="10" fill="#d97706" opacity="0.15"/>

  <!-- CAPELLI CRESPI / arruffati -->
  <ellipse cx="40" cy="6" rx="20" ry="9" fill="url(#hr2)"/>
  <ellipse cx="22" cy="12" rx="7" ry="10" fill="url(#hr2)"/>
  <ellipse cx="58" cy="12" rx="7" ry="10" fill="url(#hr2)"/>
  <!-- ciuffi irregolari -->
  <ellipse cx="28" cy="5" rx="5" ry="7" fill="#92400e"/>
  <ellipse cx="40" cy="3" rx="5" ry="6" fill="#92400e"/>
  <ellipse cx="52" cy="5" rx="5" ry="7" fill="#92400e"/>
  <!-- highlight capelli -->
  <ellipse cx="33" cy="5" rx="6" ry="3" fill="#d97706" opacity="0.4"/>

  <!-- SOPRACCIGLIA arrabbiate -->
  <path d="M24,16 Q28,13 32,15" stroke="#451a03" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M48,15 Q52,13 56,16" stroke="#451a03" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- OCCHI arrabbiati -->
  <ellipse cx="30" cy="20" rx="6" ry="6" fill="white"/>
  <ellipse cx="50" cy="20" rx="6" ry="6" fill="white"/>
  <circle cx="30" cy="21" r="4" fill="#ef4444"/>
  <circle cx="50" cy="21" r="4" fill="#ef4444"/>
  <circle cx="31" cy="21" r="2.5" fill="#0a0a0a"/>
  <circle cx="51" cy="21" r="2.5" fill="#0a0a0a"/>
  <circle cx="28" cy="18" r="1.2" fill="white"/>
  <circle cx="48" cy="18" r="1.2" fill="white"/>

  <!-- NASO -->
  <path d="M37,26 Q40,29 43,26" stroke="#d97706" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- BOCCA arrabbiata -->
  <path d="M31,31 Q40,28 49,31" stroke="#7f1d1d" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- denti stretti -->
  <path d="M33,31 Q40,29 47,31" stroke="#fef2f2" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>
</svg>
